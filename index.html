<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Bounce Zero — Browser (PixiJS)</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="frame">
        <div id="canvas-holder"></div>
        <div id="touch-controls">
          <div class="tc-dpad">
            <button id="btn-up" class="btn-updown dpad-up" aria-label="Up">▲</button>
            <button id="btn-left" aria-label="Left">◀</button>
            <button id="btn-right" aria-label="Right">▶</button>
            <button id="btn-down" class="btn-updown dpad-down" aria-label="Down">▼</button>
          </div>
          <div class="tc-middle">
            <button id="btn-pause" aria-label="Pause">II</button>
          </div>
          <div class="tc-right">
            <button id="btn-jump" aria-label="Bounce">⬆</button>
          </div>
        </div>
        <div id="hint">← → / A D move · Space / ↑ bounce · Enter select · P pause · L+R cheat</div>
        <div id="rotate-hint">Tip: rotate your phone for a bigger view</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
